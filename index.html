<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>スマホ姿勢ナビ デモ</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .water-line {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      background: rgba(80, 210, 255, 0.95);
      box-shadow: 0 0 12px rgba(80, 210, 255, 0.9);
      z-index: 3;
    }

    .underwater {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      background: rgba(0, 160, 220, 0.28);
      backdrop-filter: blur(1px);
      z-index: 2;
      pointer-events: none;
    }

    .panel {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(92vw, 420px);
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      text-align: center;
      z-index: 10;
    }

    .level {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.8);
      background: rgba(255,255,255,0.12);
    }

    .target {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
    }

    .bubble {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #00e676;
      box-shadow: 0 0 12px rgba(0,230,118,0.9);
      transition: background 0.15s, box-shadow 0.15s;
    }

    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .debug {
      font-size: 12px;
      opacity: 0.75;
    }

    button {
      margin-top: 10px;
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      font-weight: 700;
      background: #fff;
      color: #111;
    }
  </style>
</head>
<body>
  <video id="camera" autoplay playsinline muted></video>

  <div class="water-line"></div>
  <div class="underwater"></div>

  <div class="panel">
    <div class="level">
      <div class="target"></div>
      <div id="bubble" class="bubble"></div>
    </div>
    <div id="status" class="status">センサーを開始してください</div>
    <div id="debug" class="debug">beta: -- / gamma: --</div>
    <button id="startBtn">カメラ・傾きセンサー開始</button>
    <button id="calibrateBtn">この角度を基準にする</button>
  </div>

  <script>
    const video = document.getElementById("camera");
    const bubble = document.getElementById("bubble");
    const statusEl = document.getElementById("status");
    const debugEl = document.getElementById("debug");
    const startBtn = document.getElementById("startBtn");
    const calibrateBtn = document.getElementById("calibrateBtn");

    let currentBeta = 0;
    let currentGamma = 0;
    let baseBeta = null;
    let baseGamma = null;
    let hasOrientation = false;

    const OK_DEG = 8;
    const WARN_DEG = 15;
    const MAX_UI_DEG = 25;

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" }
        },
        audio: false
      });
      video.srcObject = stream;
    }

    async function requestOrientationPermissionIfNeeded() {
      if (
        typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"
      ) {
        const permission = await DeviceOrientationEvent.requestPermission();
        if (permission !== "granted") {
          throw new Error("傾きセンサーの許可が得られませんでした");
        }
      }
    }

    function startOrientation() {
      window.addEventListener("deviceorientation", (event) => {
        if (event.beta == null || event.gamma == null) return;

        currentBeta = event.beta;
        currentGamma = event.gamma;
        hasOrientation = true;

        if (baseBeta === null || baseGamma === null) {
          baseBeta = currentBeta;
          baseGamma = currentGamma;
        }

        updateGuide();
      });
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function updateGuide() {
      const diffBeta = currentBeta - baseBeta;
      const diffGamma = currentGamma - baseGamma;

      const x = clamp(diffGamma, -MAX_UI_DEG, MAX_UI_DEG) / MAX_UI_DEG;
      const y = clamp(diffBeta, -MAX_UI_DEG, MAX_UI_DEG) / MAX_UI_DEG;

      bubble.style.transform =
        `translate(calc(-50% + ${x * 42}px), calc(-50% + ${y * 42}px))`;

      const absBeta = Math.abs(diffBeta);
      const absGamma = Math.abs(diffGamma);
      const maxTilt = Math.max(absBeta, absGamma);

      let message = "その角度でOKです";
      let color = "#00e676";

      if (maxTilt > WARN_DEG) {
        color = "#ff5252";

        if (absBeta >= absGamma) {
          message = diffBeta > 0
            ? "前後方向に大きく傾いています"
            : "反対方向に大きく傾いています";
        } else {
          message = diffGamma > 0
            ? "右に傾いています。少し戻してください"
            : "左に傾いています。少し戻してください";
        }
      } else if (maxTilt > OK_DEG) {
        color = "#ffd740";

        if (absBeta >= absGamma) {
          message = "スマホの前後角度を少し調整してください";
        } else {
          message = diffGamma > 0
            ? "少し右に傾いています"
            : "少し左に傾いています";
        }
      }

      bubble.style.background = color;
      bubble.style.boxShadow = `0 0 12px ${color}`;
      statusEl.textContent = message;

      debugEl.textContent =
        `beta: ${currentBeta.toFixed(1)} / gamma: ${currentGamma.toFixed(1)} / ` +
        `差分 beta: ${diffBeta.toFixed(1)} / gamma: ${diffGamma.toFixed(1)}`;
    }

    startBtn.addEventListener("click", async () => {
      try {
        await startCamera();
        await requestOrientationPermissionIfNeeded();
        startOrientation();
        statusEl.textContent = "スマホを見やすい角度にして基準設定してください";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "カメラまたは傾きセンサーを開始できませんでした";
      }
    });

    calibrateBtn.addEventListener("click", () => {
      if (!hasOrientation) {
        statusEl.textContent = "まだ傾きセンサー値が取得できていません";
        return;
      }

      baseBeta = currentBeta;
      baseGamma = currentGamma;
      statusEl.textContent = "この角度を基準にしました";
      updateGuide();
    });
  </script>
</body>
</html>
