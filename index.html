<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Web版 浸水深シミュレーション</title>

  <!-- 既存CSSがある場合は残してください -->
  <!-- <link rel="stylesheet" href="./style.css"> -->

  <!-- スマホ姿勢ナビ用CSS -->
  <link rel="stylesheet" href="./postureGuide.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    /* カメラ映像 */
    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      z-index: 1;
    }

    /* 水中フィルター */
    #waterFilter {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      bottom: 0;
      background: rgba(0, 160, 220, 0.32);
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
      z-index: 2;
      pointer-events: none;
    }

    /* 水面ライン */
    #waterLine {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      height: 4px;
      background: rgba(80, 220, 255, 0.95);
      box-shadow:
        0 0 10px rgba(80, 220, 255, 0.9),
        0 0 22px rgba(80, 220, 255, 0.55);
      z-index: 3;
      pointer-events: none;
    }

    /* 簡易波表現 */
    #waterLine::before {
      content: "";
      position: absolute;
      left: 0;
      top: -8px;
      width: 200%;
      height: 18px;
      background:
        radial-gradient(circle at 20px 9px, rgba(255,255,255,0.8) 0 2px, transparent 3px),
        radial-gradient(circle at 70px 9px, rgba(255,255,255,0.5) 0 1.5px, transparent 3px);
      background-size: 90px 18px;
      opacity: 0.5;
      animation: waveMove 4s linear infinite;
    }

    @keyframes waveMove {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-90px);
      }
    }

    /* 既存UI想定 */
    #controlPanel {
      position: fixed;
      left: 12px;
      bottom: 12px;
      width: min(56vw, 260px);
      padding: 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.62);
      color: #fff;
      z-index: 20;
      box-sizing: border-box;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    #controlPanel h1 {
      margin: 0 0 8px;
      font-size: 15px;
      line-height: 1.3;
    }

    #controlPanel p {
      margin: 4px 0;
      font-size: 12px;
      line-height: 1.45;
    }

    .control-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .control-row button {
      border: none;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.92);
      color: #111;
    }

    .height-slider-wrap {
      margin-top: 8px;
    }

    #waterHeightSlider {
      width: 100%;
    }

    #cameraStartBtn {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 999px;
      padding: 10px;
      font-weight: 700;
      background: #ffffff;
      color: #111;
    }

    @media (max-width: 420px) {
      #controlPanel {
        width: calc(100vw - 210px);
        min-width: 140px;
        padding: 10px;
      }

      #controlPanel h1 {
        font-size: 13px;
      }

      #controlPanel p {
        font-size: 11px;
      }

      .control-row button {
        padding: 7px 8px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body>
  <!-- カメラ映像 -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <!-- 水中フィルター -->
  <div id="waterFilter"></div>

  <!-- 水面ライン -->
  <div id="waterLine"></div>

  <!-- 既存UI想定 -->
  <div id="controlPanel">
    <h1>浸水深シミュレーション</h1>
    <p>水面ラインを浸水深標識や目安の高さに合わせてください。</p>
    <p id="heightLabel">水面位置：50%</p>

    <button id="cameraStartBtn" type="button">カメラ開始</button>

    <div class="height-slider-wrap">
      <input id="waterHeightSlider" type="range" min="10" max="90" value="50">
    </div>

    <div class="control-row">
      <button type="button" data-height="30">高め</button>
      <button type="button" data-height="50">中央</button>
      <button type="button" data-height="70">低め</button>
    </div>
  </div>

  <!-- スマホ姿勢ナビUI -->
  <div id="postureGuide" class="posture-guide">
    <div class="posture-header">
      <span class="posture-title">スマホ姿勢ナビ</span>
      <button id="postureToggleDebug" class="posture-small-btn" type="button">詳細</button>
    </div>

    <div class="posture-level">
      <div class="posture-target"></div>
      <div id="postureBubble" class="posture-bubble"></div>
    </div>

    <div id="postureStatus" class="posture-status">
      傾きセンサーを開始してください
    </div>

    <div id="postureDebug" class="posture-debug hidden">
      beta: -- / gamma: --<br>
      diffBeta: -- / diffGamma: --
    </div>

    <div class="posture-buttons">
      <button id="postureStartBtn" type="button">傾きセンサー開始</button>
      <button id="postureCalibrateBtn" type="button">この角度を基準にする</button>
    </div>
  </div>

  <script>
    /*
      既存のカメラ表示・水面ライン調整処理の簡易版です。
      すでに既存JSがある場合、このscript部分は無理に置き換えず、
      既存処理を残してください。
    */

    const cameraVideo = document.getElementById("cameraVideo");
    const cameraStartBtn = document.getElementById("cameraStartBtn");
    const waterLine = document.getElementById("waterLine");
    const waterFilter = document.getElementById("waterFilter");
    const waterHeightSlider = document.getElementById("waterHeightSlider");
    const heightLabel = document.getElementById("heightLabel");

    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("このブラウザではカメラを利用できません。");
          return;
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        cameraVideo.srcObject = stream;
      } catch (error) {
        console.error("[Camera]", error);
        alert("カメラを開始できませんでした。ブラウザの許可設定を確認してください。");
      }
    }

    function setWaterLinePosition(percent) {
      const safePercent = Math.max(5, Math.min(95, Number(percent)));

      waterLine.style.top = `${safePercent}%`;
      waterFilter.style.top = `${safePercent}%`;

      if (heightLabel) {
        heightLabel.textContent = `水面位置：${safePercent}%`;
      }

      if (waterHeightSlider) {
        waterHeightSlider.value = safePercent;
      }
    }

    if (cameraStartBtn) {
      cameraStartBtn.addEventListener("click", startCamera);
    }

    if (waterHeightSlider) {
      waterHeightSlider.addEventListener("input", (event) => {
        setWaterLinePosition(event.target.value);
      });
    }

    document.querySelectorAll("[data-height]").forEach((button) => {
      button.addEventListener("click", () => {
        setWaterLinePosition(button.dataset.height);
      });
    });

    // 初期位置
    setWaterLinePosition(50);
  </script>

  <!-- スマホ姿勢ナビ用JS -->
  <script src="./postureGuide.js"></script>
</body>
</html>
