<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>WebAR 浸水シミュレーション MVP</title>

  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body>
  <div id="ar-container"></div>

  <div id="underwater-overlay" aria-hidden="true"></div>
  <div id="caustics-overlay" aria-hidden="true"></div>

  <div id="water-line" aria-hidden="true">
    <svg viewBox="0 0 1200 96" preserveAspectRatio="none">
      <path
        id="wave-path-back"
        d="M0,48 C100,26 200,70 300,48 C400,26 500,70 600,48 C700,26 800,70 900,48 C1000,26 1100,70 1200,48"
      ></path>

      <path
        id="wave-path-front"
        d="M0,48 C100,26 200,70 300,48 C400,26 500,70 600,48 C700,26 800,70 900,48 C1000,26 1100,70 1200,48"
      ></path>
    </svg>
  </div>

  <div id="ui-panel">
    <div id="title">WebAR 浸水シミュレーション</div>

    <div id="status">ARを開始してください</div>

    <div id="buttons">
      <button id="start-button" type="button">ARを開始</button>
      <button id="reset-button" type="button" disabled>水面高さを再設定</button>
    </div>

    <details>
      <summary>使い方</summary>
      <ol>
        <li>HTTPS環境で開き、カメラを許可します。</li>
        <li>浸水高さ標識の波マークを画面に映します。</li>
        <li>約1秒間サンプリング後、その高さに水面を固定します。</li>
        <li>再設定したい場合は「水面高さを再設定」を押します。</li>
      </ol>
    </details>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
